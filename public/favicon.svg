<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Vibrant orange gradient matching the portfolio's accent color -->
    <linearGradient id="orange-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB366" />
      <stop offset="100%" stop-color="#FF8C00" />
    </linearGradient>
  </defs>
  
  <!-- Clean, bold geometric monogram 'M' -->
  <path 
    d="M 96,400 V 150 C 96,120 115,100 140,100 C 165,100 180,115 185,135 L 256,260 L 327,135 C 332,115 347,100 372,100 C 397,100 416,120 416,150 V 400" 
    fill="none" 
    stroke="url(#orange-grad)" 
    stroke-width="50" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />
  
  <!-- Modern tech accent dot -->
  <circle cx="256" cy="340" r="25" fill="#FFFFFF" opacity="0.9" />
</svg>